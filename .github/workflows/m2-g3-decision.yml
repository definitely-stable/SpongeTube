name: M2-G3 Transport Decision

on:
  workflow_call:
    inputs:
      concurrency_suffix:
        description: Unique suffix when invoked by a parent canonical workflow.
        required: false
        type: string
        default: ""
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/m2-g2-aggregate.yml"
      - ".github/workflows/m2-g3-decision.yml"
      - ".github/workflows/m2-g2-n0.yml"
      - ".github/workflows/m2-g2-network.yml"
      - ".github/workflows/m2-g2-transport.yml"
      - ".github/workflows/m2-g2-route.yml"
      - ".work/milestones/M2.md"
      - ".work/ROADMAP.md"
      - ".work/VERIFICATION.md"
      - ".work/schemas/**"
      - "scripts/measurement/**"
      - "scripts/ci/**"
      - "core/engine/**"
      - "core/storage/**"
      - "tools/media-lab/**"
      - "tools/fault-harness/**"
      - "test-fixtures/media/**"
      - "test-fixtures/network/m2/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/m2-g2-aggregate.yml"
      - ".github/workflows/m2-g3-decision.yml"
      - ".github/workflows/m2-g2-n0.yml"
      - ".github/workflows/m2-g2-network.yml"
      - ".github/workflows/m2-g2-transport.yml"
      - ".github/workflows/m2-g2-route.yml"
      - ".work/milestones/M2.md"
      - ".work/ROADMAP.md"
      - ".work/VERIFICATION.md"
      - ".work/schemas/**"
      - "scripts/measurement/**"
      - "scripts/ci/**"
      - "core/engine/**"
      - "core/storage/**"
      - "tools/media-lab/**"
      - "tools/fault-harness/**"
      - "test-fixtures/media/**"
      - "test-fixtures/network/m2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-g3-decision-${{ inputs.concurrency_suffix || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canonical-g2:
    name: fresh-canonical-g2
    uses: ./.github/workflows/m2-g2-aggregate.yml
    with:
      concurrency_suffix: g3-${{ github.run_id }}

  decision:
    name: retained-transport-decision
    needs: canonical-g2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact G3 source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download fresh canonical G2 aggregate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m2-g2-canonical-evidence
          path: build/m2-g3/input

      - name: Produce and independently verify G3 decision
        shell: bash
        run: |
          set -euo pipefail
          root="build/m2-g3"
          mkdir -p "$root/source" "$root/output"

          mapfile -t indexes < <(find "$root/input" -type f -name 'm2-g2-evidence-index-v1.json' -print)
          test "${#indexes[@]}" -eq 1
          cp "${indexes[0]}" "$root/source/m2-g2-evidence-index-v1.json"
          source_index="$root/source/m2-g2-evidence-index-v1.json"
          decision="$root/output/m2-g3-transport-decision-v1.json"

          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 -m py_compile scripts/measurement/m2_transport_decision.py
          python3 -m unittest scripts.measurement.tests.test_m2_transport_decision -v

          python3 scripts/measurement/m2_transport_decision.py produce \
            --g2-index "$source_index" \
            --expected-git-commit "$SOURCE_HEAD_SHA" \
            --output "$decision"

          python3 scripts/measurement/m2_transport_decision.py verify \
            --g2-index "$source_index" \
            --decision "$decision" \
            --expected-git-commit "$SOURCE_HEAD_SHA"

          test "$(jq -r '.status' "$decision")" = "PASS"
          test "$(jq -r '.decision.state' "$decision")" = "TECHNICALLY_ELIGIBLE_NO_SELECTION"
          test "$(jq -r '.decision.selectedBackend' "$decision")" = "null"
          test "$(jq -r '.deviceEvidence.performanceSelectionAllowed' "$decision")" = "false"
          test "$(jq -r '.nextAllowedAction' "$decision")" = "M2_H_CANONICAL_ACCEPTANCE"

          {
            echo "gitCommit=$SOURCE_HEAD_SHA"
            echo "sourceGate=M2-ACC-10 PASS"
            echo "decision=TECHNICALLY_ELIGIBLE_NO_SELECTION"
            echo "selectedBackend=none"
            echo "physicalDeviceEvidence=false"
            echo "performanceSelectionAllowed=false"
            echo "nextAllowedAction=M2-H"
          } > "$root/output/acceptance.txt"

      - name: Upload G3 retained decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-g3-transport-decision
          path: |
            build/m2-g3/source/
            build/m2-g3/output/
          if-no-files-found: error
          retention-days: 14
