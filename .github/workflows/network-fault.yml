name: Network Fault Harness

on:
  pull_request:
    paths:
      - ".github/workflows/network-fault.yml"
      - "core/engine/src/androidTest/**"
      - "scripts/faults/**"
      - "scripts/ci/verify-m2-e0-topology.py"
      - "tools/fault-harness/**"
      - "tools/media-lab/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/network-fault.yml"
      - "core/engine/src/androidTest/**"
      - "scripts/faults/**"
      - "scripts/ci/verify-m2-e0-topology.py"
      - "tools/fault-harness/**"
      - "tools/media-lab/**"
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

concurrency:
  group: network-fault-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-capability:
    name: m2-e0-host-capability
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove scoped host fault capabilities
        shell: bash
        run: |
          set -euo pipefail

          test "$(uname -m)" = "x86_64"
          sudo -n true

          root="$PWD/build/m2-e0/host"
          tooling="$PWD/build/m2-e0/tooling"
          rm -rf "$root" "$tooling"
          mkdir -p "$root" "$tooling"

          uname -r > "$root/kernel-release.txt"
          tc -Version > "$root/system-tc-version.txt" 2>&1

          bash scripts/faults/install_iproute2_tc.sh "$tooling" > "$root/tc.json"
          TC_BIN="$tooling/tc"

          run_netem() {
            sudo env SPONGE_TC_BIN="$TC_BIN"               bash scripts/faults/netem_apply.sh "$@"
          }

          cleanup_netns() {
            run_netem teardown || true
          }
          trap cleanup_netns EXIT

          run_netem prepare
          run_netem seed-probe > "$root/netem-seed.json"
          run_netem filter-probe > "$root/filter.json"

          cleanup_netns
          trap - EXIT

          bash scripts/faults/install_toxiproxy.sh "$tooling" > "$root/toxiproxy.json"

          python3 scripts/ci/verify-m2-e0-topology.py host "$root"

      - name: Upload E0 host capability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-e0-host-capability
          path: build/m2-e0/host/
          if-no-files-found: error
          retention-days: 14

  android-topology:
    name: m2-e0-api36-topology
    needs: host-capability
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Build E0 Android probe and Media Lab
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --dependency-verification=strict --configuration-cache             :core:engine:assembleDebugAndroidTest             :tools:media-lab:installDist

      - name: Prepare API 36 emulator
        shell: bash
        run: |
          bash scripts/ci/prepare-emulator.sh             36             m2-e0-api36             build/m2-e0/device

      - name: Prove direct Android media topology and control isolation
        shell: bash
        run: |
          set -euo pipefail

          root="$PWD/build/m2-e0/android-topology"
          tooling="$PWD/build/m2-e0/android-tooling"
          rm -rf "$root" "$tooling"
          mkdir -p "$root/android" "$tooling"

          bash scripts/faults/install_iproute2_tc.sh "$tooling" > "$root/tc.json"
          TC_BIN="$tooling/tc"

          run_netem() {
            sudo env SPONGE_TC_BIN="$TC_BIN"               bash scripts/faults/netem_apply.sh "$@"
          }

          media_pid=""
          control_pid=""
          lab_pid=""

          stop_pid() {
            local pid="${1:-}"
            [[ -n "$pid" ]] || return 0
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              for _ in {1..20}; do
                kill -0 "$pid" 2>/dev/null || break
                sleep 0.1
              done
              kill -9 "$pid" 2>/dev/null || true
            fi
            wait "$pid" 2>/dev/null || true
          }

          emergency_cleanup() {
            adb reverse --remove tcp:18083 >/dev/null 2>&1 || true
            stop_pid "$control_pid"
            stop_pid "$lab_pid"
            run_netem teardown >/dev/null 2>&1 || true
            stop_pid "$media_pid"
          }
          trap emergency_cleanup EXIT

          LAB_BIN="$(find tools/media-lab/build/install -type f -name media-lab -perm -111 | head -1)"
          test -n "$LAB_BIN"

          "$LAB_BIN" serve             "--fixture-root=$PWD/test-fixtures/media"             "--trace=$root/media-lab-requests.jsonl"             --session-id=m2-e0-control-health             --profile=N0             --data-port=18084             --control-port=18082             > "$root/media-lab.out"             2> "$root/media-lab.err" &
          lab_pid=$!
          printf '%s\n' "$lab_pid" > "$root/media-lab.pid"

          python3 scripts/faults/e0_probe_server.py             --bind=127.0.0.1             --port=18083             --role=control             --log="$root/control-requests.jsonl"             > "$root/control.out"             2> "$root/control.err" &
          control_pid=$!
          printf '%s\n' "$control_pid" > "$root/control.pid"

          run_netem prepare
          sudo ip netns exec sponge-m2e-e0             python3 "$PWD/scripts/faults/e0_probe_server.py"               --bind=198.18.0.2               --port=18081               --role=media               --log="$root/media-requests.jsonl"               > "$root/media.out"               2> "$root/media.err" &
          media_pid=$!
          printf '%s\n' "$media_pid" > "$root/media.pid"

          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18082/__lab/config >/dev/null &&
               curl --fail --silent http://127.0.0.1:18083/probe >/dev/null &&
               curl --fail --silent http://198.18.0.2:18081/probe >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 40 ]]; then
              cat "$root/media-lab.err" >&2 || true
              cat "$root/control.err" >&2 || true
              cat "$root/media.err" >&2 || true
              exit 1
            fi
            sleep 0.25
          done

          [[ "$(adb get-state)" == "device" ]]
          curl --fail --silent http://127.0.0.1:18082/__lab/config >/dev/null

          adb reverse tcp:18083 tcp:18083
          reverse_state="$(adb reverse --list)"
          grep -q 'tcp:18083' <<<"$reverse_state"
          ! grep -q 'tcp:18081' <<<"$reverse_state"

          run_netem apply
          run_netem inspect > "$root/qdisc-before.json"

          [[ "$(adb get-state)" == "device" ]]
          curl --fail --silent http://127.0.0.1:18082/__lab/config >/dev/null

          ./gradlew --dependency-verification=strict             :core:engine:connectedDebugAndroidTest             -Pandroid.testInstrumentationRunnerArguments.class=io.github.definitelystable.spongetube.core.engine.FaultTopologyAndroidTest             -Pandroid.testInstrumentationRunnerArguments.spongetube.m2e.mediaBaseUrl=http://198.18.0.2:18081             -Pandroid.testInstrumentationRunnerArguments.spongetube.m2e.controlBaseUrl=http://127.0.0.1:18083

          run_netem inspect > "$root/qdisc-after.json"

          [[ "$(adb get-state)" == "device" ]]
          curl --fail --silent http://127.0.0.1:18082/__lab/config >/dev/null

          source_file="$(find core/engine/build/outputs/connected_android_test_additional_output             -type f -path '*/m2-e0-topology/evidence.json' -print -quit)"
          test -n "$source_file"
          cp "$source_file" "$root/android/evidence.json"

          python3 - "$root/host-state.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "schemaVersion": 1,
              "adbBefore": True,
              "adbDuring": True,
              "adbAfter": True,
              "mediaLabBefore": True,
              "mediaLabDuring": True,
              "mediaLabAfter": True,
              "controlReversePresent": True,
              "mediaReverseAbsent": True,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          run_netem remove
          adb reverse --remove tcp:18083
          stop_pid "$control_pid"
          control_pid=""
          stop_pid "$lab_pid"
          lab_pid=""
          run_netem teardown
          stop_pid "$media_pid"
          media_pid=""

          run_netem cleanup-state > "$root/cleanup-base.json"

          reverse_clean=true
          if adb reverse --list | grep -Eq 'tcp:18081|tcp:18083'; then
            reverse_clean=false
          fi

          child_processes_stopped=true
          for pid_file in "$root/media.pid" "$root/control.pid" "$root/media-lab.pid"; do
            if [[ -s "$pid_file" ]] && kill -0 "$(cat "$pid_file")" 2>/dev/null; then
              child_processes_stopped=false
            fi
          done

          python3 - "$root/cleanup-base.json" "$root/cleanup-state.json"             "$reverse_clean" "$child_processes_stopped" <<'PY'
          import json
          import sys
          from pathlib import Path

          source, output, reverse_clean, children_stopped = sys.argv[1:]
          value = json.loads(Path(source).read_text(encoding="utf-8"))
          value["reverseClean"] = reverse_clean == "true"
          value["childProcessesStopped"] = children_stopped == "true"
          Path(output).write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          rm -f "$root/cleanup-base.json"

          python3 scripts/ci/verify-m2-e0-topology.py android "$root"

          trap - EXIT

      - name: Ensure E0 cleanup
        if: always()
        shell: bash
        run: |
          set +e
          TC_BIN="$PWD/build/m2-e0/android-tooling/tc"
          adb reverse --remove tcp:18083 >/dev/null 2>&1
          if [[ -x "$TC_BIN" ]]; then
            sudo env SPONGE_TC_BIN="$TC_BIN"               bash scripts/faults/netem_apply.sh teardown >/dev/null 2>&1
          else
            sudo ip netns del sponge-m2e-e0 >/dev/null 2>&1
            sudo ip link del m2e0-host >/dev/null 2>&1
          fi
          for pid_file in             build/m2-e0/android-topology/control.pid             build/m2-e0/android-topology/media-lab.pid             build/m2-e0/android-topology/media.pid; do
            if [[ -s "$pid_file" ]]; then
              kill "$(cat "$pid_file")" >/dev/null 2>&1 || true
            fi
          done
          adb emu kill >/dev/null 2>&1 || true

      - name: Upload E0 Android topology evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-e0-api36-topology
          path: |
            build/m2-e0/android-topology/
            core/engine/build/outputs/androidTest-results/
            core/engine/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 14
