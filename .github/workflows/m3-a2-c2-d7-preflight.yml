name: M3-A2-C2-D7 Manifest Provenance Preflight
# Offline tests and exact pinned yt-dlp method inspection only.
on:
  pull_request:
    paths:
      - '.work/m3-a2/c2-d7-*'
      - 'scripts/measurement/m3_c2_d7.py'
      - 'scripts/measurement/tests/test_m3_c2_d7.py'
      - '.github/workflows/m3-a2-c2-d7*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-d7-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate D7 plan and synthetic falsification
        run: |
          set -euo pipefail
          python3 scripts/measurement/m3_c2_d7.py validate-plan
          python3 -m unittest discover -s scripts/measurement/tests -p 'test_m3_c2_d7.py' -v
      - name: Verify pinned inherited parser and direct hook contracts
        run: |
          set -euo pipefail
          python3 -m venv build/d7-venv
          build/d7-venv/bin/python -m pip install --disable-pip-version-check --no-input 'yt-dlp==2026.10.21'
          build/d7-venv/bin/python scripts/measurement/m3_c2_d7.py validate-hooks
