name: M2-G2 Paired API36 Route Replacement

on:
  workflow_call:
    inputs:
      concurrency_suffix:
        description: Unique suffix when invoked by a canonical caller workflow.
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - ".work/milestones/M2.md"
      - ".work/ROADMAP.md"
      - ".github/workflows/m2-g2-route.yml"
      - ".work/schemas/route-events-v1.schema.json"
      - ".work/schemas/route-verification-summary-v1.schema.json"
      - ".work/schemas/transport-pair-plan-v1.schema.json"
      - ".work/schemas/transport-evaluation-trials-v1.schema.json"
      - "core/engine/**"
      - "core/storage/**"
      - "tools/media-lab/**"
      - "scripts/ci/run-m2-g2-route.sh"
      - "scripts/ci/verify-m2-g2-route.py"
      - "scripts/ci/verify-m2-g2-network.py"
      - "scripts/ci/prepare-emulator.sh"
      - "scripts/faults/m2_e0_netns.sh"
      - "scripts/measurement/m2_transport_pair_plan.py"
      - "scripts/measurement/m2_transport_evaluation_oracle.py"
      - "scripts/measurement/m2_route_oracle.py"
      - "scripts/measurement/m2_contracts.py"
      - "scripts/measurement/schema_subset.py"
      - "scripts/measurement/tests/test_m2_transport_pair_plan.py"
      - "scripts/measurement/tests/test_m2_g2_route_verifier.py"
      - "test-fixtures/network/m2/g2/**"
      - "test-fixtures/network/m2/n6-default-route-loss-restore.json"
      - "test-fixtures/media/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/m2-g2-route.yml"
      - ".work/schemas/route-events-v1.schema.json"
      - ".work/schemas/route-verification-summary-v1.schema.json"
      - ".work/schemas/transport-pair-plan-v1.schema.json"
      - ".work/schemas/transport-evaluation-trials-v1.schema.json"
      - "core/engine/**"
      - "core/storage/**"
      - "tools/media-lab/**"
      - "scripts/ci/run-m2-g2-route.sh"
      - "scripts/ci/verify-m2-g2-route.py"
      - "scripts/ci/verify-m2-g2-network.py"
      - "scripts/ci/prepare-emulator.sh"
      - "scripts/faults/m2_e0_netns.sh"
      - "scripts/measurement/m2_transport_pair_plan.py"
      - "scripts/measurement/m2_transport_evaluation_oracle.py"
      - "scripts/measurement/m2_route_oracle.py"
      - "scripts/measurement/m2_contracts.py"
      - "scripts/measurement/schema_subset.py"
      - "scripts/measurement/tests/test_m2_transport_pair_plan.py"
      - "scripts/measurement/tests/test_m2_g2_route_verifier.py"
      - "test-fixtures/network/m2/g2/**"
      - "test-fixtures/network/m2/n6-default-route-loss-restore.json"
      - "test-fixtures/media/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-g2-route-${{ github.workflow }}-${{ inputs.concurrency_suffix || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m2-g2-route-api36-paired:
    name: m2-g2-route-api36-paired
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Run host route-pair contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest             scripts.measurement.tests.test_m2_transport_pair_plan             scripts.measurement.tests.test_m2_g2_route_verifier

      - name: Execute frozen route-replacement paired schedule
        shell: bash
        run: bash scripts/ci/run-m2-g2-route.sh

      - name: Cleanup G2-E lab
        if: always()
        shell: bash
        run: |
          set +e
          adb shell cmd connectivity airplane-mode disable >/dev/null 2>&1 || true
          adb shell svc data enable >/dev/null 2>&1 || true
          adb shell svc wifi enable >/dev/null 2>&1 || true
          bash scripts/faults/m2_e0_netns.sh teardown >/dev/null 2>&1 || true
          adb emu kill >/dev/null 2>&1 || true

      - name: Upload G2-E route evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-g2-route-api36-paired
          path: |
            build/m2-g2-route/
            core/engine/build/outputs/androidTest-results/
            core/engine/build/outputs/connected_android_test_additional_output/
            core/engine/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14
