name: Media Lab B1 Verify
# Temporary verification workflow for M0-B1; remove before merge.

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-lab-b1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-lab-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate verification metadata and run B1 tests
        shell: bash
        run: |
          ./gradlew --write-verification-metadata sha256 :tools:media-lab:test --stacktrace

      - name: Show dependency verification metadata
        if: always()
        shell: bash
        run: |
          echo "::group::verification-metadata.xml"
          cat gradle/verification-metadata.xml
          echo "::endgroup::"

      - name: Upload B1 verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-lab-b1
          path: |
            gradle/verification-metadata.xml
            tools/media-lab/build/reports/tests/
            tools/media-lab/build/test-results/
          if-no-files-found: warn
