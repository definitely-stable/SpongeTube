name: M2-G2 N0 Paired API36 Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/m2-g2-n0.yml"
      - ".work/schemas/transport-pair-plan-v1.schema.json"
      - ".work/schemas/transport-evaluation-trials-v1.schema.json"
      - ".work/milestones/M2.md"
      - "core/engine/**"
      - "tools/media-lab/**"
      - "scripts/measurement/m2_transport_pair_plan.py"
      - "scripts/measurement/m2_transport_evaluation_oracle.py"
      - "scripts/measurement/m2_contracts.py"
      - "scripts/ci/verify-m2-g2-n0.py"
      - "scripts/faults/m2_e0_netns.sh"
      - "scripts/ci/prepare-emulator.sh"
      - "test-fixtures/media/**"
      - "test-fixtures/network/m2/n0-control.json"
      - "test-fixtures/network/m2/g2/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/m2-g2-n0.yml"
      - ".work/schemas/transport-pair-plan-v1.schema.json"
      - ".work/schemas/transport-evaluation-trials-v1.schema.json"
      - "core/engine/**"
      - "tools/media-lab/**"
      - "scripts/measurement/**"
      - "scripts/ci/verify-m2-g2-n0.py"
      - "test-fixtures/network/m2/g2/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-g2-n0-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api36-n0-paired:
    name: m2-g2-n0-api36-paired
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Freeze N0 pair plan before Android execution
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/build/m2-g2-n0"
          mkdir -p "$root" core/engine/src/androidTest/assets
          plan="$root/plan.json"

          python3 scripts/measurement/m2_transport_pair_plan.py build \
            --scenario test-fixtures/network/m2/n0-control.json \
            --work test-fixtures/network/m2/g2/work-f1-audio-segment-1.json \
            --device-state test-fixtures/network/m2/g2/device-api36-emulator.json \
            --cache-state test-fixtures/network/m2/g2/cache-empty-http-disabled.json \
            --recovery-policy test-fixtures/network/m2/g2/recovery-sponge-v2.json \
            --route-policy test-fixtures/network/m2/g2/route-exact-default.json \
            --run-id m2-g2-n0-api36 \
            --pair-id m2-g2-n0-api36-cold \
            --ordering-seed 20261001 \
            --blocks 2 \
            --playback-mode SPONGE \
            --connection-state COLD \
            --output "$plan"

          python3 scripts/measurement/m2_transport_pair_plan.py verify \
            --plan "$plan" \
            --scenario test-fixtures/network/m2/n0-control.json \
            --work test-fixtures/network/m2/g2/work-f1-audio-segment-1.json \
            --device-state test-fixtures/network/m2/g2/device-api36-emulator.json \
            --cache-state test-fixtures/network/m2/g2/cache-empty-http-disabled.json \
            --recovery-policy test-fixtures/network/m2/g2/recovery-sponge-v2.json \
            --route-policy test-fixtures/network/m2/g2/route-exact-default.json

          cp "$plan" core/engine/src/androidTest/assets/m2-g2-n0-plan.json
          python3 - "$plan" > "$root/schedule.txt" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          for block in plan["blocks"]:
              for row in sorted(block["trials"], key=lambda x: x["positionInBlock"]):
                  print(row["trialId"])
          PY
          test "$(wc -l < "$root/schedule.txt")" -eq 4

      - name: Build G2-B probe and Media Lab
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --dependency-verification=strict --configuration-cache \
            :core:engine:assembleDebugAndroidTest \
            :tools:media-lab:installDist

      - name: Prepare API 36 emulator
        shell: bash
        run: |
          bash scripts/ci/prepare-emulator.sh \
            36 \
            m2-g2-n0-api36 \
            build/m2-g2-n0/device

      - name: Execute frozen N0 schedule in fresh instrumentation processes
        shell: bash
        run: |
          set -euo pipefail

          root="$PWD/build/m2-g2-n0"
          server_root="$root/server"
          raw_root="$root/raw"
          output_root="$root/output"
          mkdir -p "$server_root" "$raw_root" "$output_root"

          LAB_BIN="$(find tools/media-lab/build/install -type f -name media-lab -perm -111 | head -1)"
          test -n "$LAB_BIN"
          LAB_BIN="$(realpath "$LAB_BIN")"
          trace="$server_root/requests.jsonl"
          lab_pid=""

          cleanup() {
            set +e
            if [[ -n "$lab_pid" ]] && kill -0 "$lab_pid" 2>/dev/null; then
              kill "$lab_pid" >/dev/null 2>&1 || true
              wait "$lab_pid" >/dev/null 2>&1 || true
            fi
            bash scripts/faults/m2_e0_netns.sh teardown >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          bash scripts/faults/m2_e0_netns.sh prepare
          ns="$(bash scripts/faults/m2_e0_netns.sh namespace)"
          media_addr="$(bash scripts/faults/m2_e0_netns.sh media-address)"

          sudo -n ip netns exec "$ns" \
            env JAVA_HOME="$JAVA_HOME" PATH="$JAVA_HOME/bin:/usr/bin:/bin" \
            "$LAB_BIN" serve \
              "--fixture-root=$PWD/test-fixtures/media" \
              "--trace=$trace" \
              --session-id=m2-g2-n0 \
              --profile=N0 \
              "--data-bind-address=$media_addr" \
              --data-port=18081 \
              --control-port=18082 \
            > "$server_root/media-lab.out" \
            2> "$server_root/media-lab.err" &
          lab_pid=$!

          for attempt in {1..60}; do
            if sudo -n ip netns exec "$ns" \
              curl --fail --silent http://127.0.0.1:18082/__lab/config \
              > "$server_root/config.json"; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              cat "$server_root/media-lab.err" >&2 || true
              exit 1
            fi
            sleep 0.1
          done

          adb get-state | tee "$root/adb-before.txt" | grep -Fxq device
          serial="$(adb get-serialno | tr -d '\r')"
          [[ "$serial" =~ ^emulator-[0-9]+$ ]]
          actual_api="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          actual_abi="$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          test "$actual_api" = "36"
          test "$actual_abi" = "x86_64"
          adb shell dumpsys battery > "$root/battery.txt"
          grep -Fq 'AC powered: true' "$root/battery.txt"
          python3 - "$root/device-runtime.json" "$actual_api" "$actual_abi" <<'PY'
          import json, sys
          path, api, abi = sys.argv[1:]
          with open(path, "w", encoding="utf-8") as handle:
              json.dump({
                  "deviceClass": "ANDROID_EMULATOR",
                  "androidApi": int(api),
                  "abi": abi,
                  "batteryPolicy": "CI_POWERED",
                  "acPowered": True,
              }, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          if adb reverse --list | grep -Eq 'tcp:18081([[:space:]]|$)'; then
            echo "M2-G2 media path must use the Android default Network, not adb reverse" >&2
            exit 1
          fi
          printf 'ok\n' > "$root/media-reverse-absent.txt"

          jitter_seed="$(python3 - <<'PY'
          import json
          print(json.load(open("test-fixtures/network/m2/g2/recovery-sponge-v2.json"))["jitterSeed"])
          PY
          )"
          test "$jitter_seed" = "424243"

          while IFS= read -r trial_id; do
            test -n "$trial_id"
            echo "Executing frozen G2-B trial: $trial_id"
            ./gradlew --dependency-verification=strict \
              :core:engine:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=io.github.definitelystable.spongetube.core.engine.route.TransportPairN0AndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.spongetube.m2g2.originBaseUrl="http://$media_addr:18081" \
              -Pandroid.testInstrumentationRunnerArguments.spongetube.m2g2.trialId="$trial_id" \
              -Pandroid.testInstrumentationRunnerArguments.spongetube.m2g2.recoveryJitterSeed="$jitter_seed"

            source_file="$(find core/engine/build/outputs/connected_android_test_additional_output \
              -type f -path "*/m2-g2-n0/$trial_id.json" -print -quit)"
            test -n "$source_file"
            cp "$source_file" "$raw_root/$trial_id.json"
          done < "$root/schedule.txt"

          test "$(find "$raw_root" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 4
          test -s "$trace"

          python3 scripts/ci/verify-m2-g2-n0.py \
            --plan "$root/plan.json" \
            --raw-dir "$raw_root" \
            --origin-trace "$trace" \
            --scenario test-fixtures/network/m2/n0-control.json \
            --work test-fixtures/network/m2/g2/work-f1-audio-segment-1.json \
            --device-state test-fixtures/network/m2/g2/device-api36-emulator.json \
            --cache-state test-fixtures/network/m2/g2/cache-empty-http-disabled.json \
            --recovery-policy test-fixtures/network/m2/g2/recovery-sponge-v2.json \
            --route-policy test-fixtures/network/m2/g2/route-exact-default.json \
            --device-runtime "$root/device-runtime.json" \
            --output-dir "$output_root"

          python3 scripts/measurement/m2_transport_pair_plan.py verify-results \
            --plan "$root/plan.json" \
            --trials "$output_root/transport-evaluation-trials-v1.json" \
            --scenario test-fixtures/network/m2/n0-control.json \
            --work test-fixtures/network/m2/g2/work-f1-audio-segment-1.json \
            --device-state test-fixtures/network/m2/g2/device-api36-emulator.json \
            --cache-state test-fixtures/network/m2/g2/cache-empty-http-disabled.json \
            --recovery-policy test-fixtures/network/m2/g2/recovery-sponge-v2.json \
            --route-policy test-fixtures/network/m2/g2/route-exact-default.json

          adb get-state | tee "$root/adb-after.txt" | grep -Fxq device
          cleanup
          trap - EXIT
          bash scripts/faults/m2_e0_netns.sh assert-clean
          printf 'ok\n' > "$root/cleanup.txt"

      - name: Cleanup G2-B lab
        if: always()
        shell: bash
        run: |
          set +e
          bash scripts/faults/m2_e0_netns.sh teardown >/dev/null 2>&1 || true
          adb emu kill >/dev/null 2>&1 || true
          rm -f core/engine/src/androidTest/assets/m2-g2-n0-plan.json

      - name: Upload G2-B N0 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-g2-n0-api36-paired
          path: |
            build/m2-g2-n0/
            core/engine/build/outputs/androidTest-results/
            core/engine/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 14
