name: M3-A2 Canonical Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .work/m3-a2/canonical-run-v1.trigger

permissions:
  contents: read

concurrency:
  group: m3-a2-canonical-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: canonical bounded matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact trigger revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate frozen registry and plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/measurement/m3_matrix.py validate-registry \
            --registry .work/m3-a2/case-registry-v1.json
          python3 scripts/measurement/m3_matrix.py validate-plan \
            --registry .work/m3-a2/case-registry-v1.json \
            --plan .work/m3-a2/matrix-plan-v2.json

      - name: Fetch pinned case-selection source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m3-a2/source
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          registry = json.loads(
              pathlib.Path(".work/m3-a2/case-registry-v1.json").read_text(encoding="utf-8")
          )
          selections = [case["selectionEvidence"] for case in registry["cases"]]
          repositories = {item["sourceRepository"] for item in selections}
          revisions = {item["sourceRevision"] for item in selections}
          paths = {item["sourcePath"] for item in selections}
          if repositories != {"yt-dlp/yt-dlp"} or len(revisions) != 1 or len(paths) != 1:
              raise SystemExit("M3-A2 source provenance is not singular and pinned")
          revision = next(iter(revisions))
          source_path = next(iter(paths))
          url = f"https://raw.githubusercontent.com/yt-dlp/yt-dlp/{revision}/{source_path}"
          target = pathlib.Path("build/m3-a2/source/_video.py")
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = response.read()
          if not payload:
              raise SystemExit("Pinned yt-dlp source fetch returned empty content")
          target.write_bytes(payload)
          print("Pinned M3-A2 case-selection source fetched")
          PY

      - name: Create isolated reference-oracle environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/m3-a2/venv
          build/m3-a2/venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-input \
            "yt-dlp==2026.8.19"
          test "$(build/m3-a2/venv/bin/python -c 'import yt_dlp.version; print(yt_dlp.version.__version__)')" = "2026.08.19"
          test "$(build/m3-a2/venv/bin/python -c 'import yt_dlp.version; print(yt_dlp.version.RELEASE_GIT_HEAD)')" = "594bd50c2c78ac432f81600d309fdc4e0a92d82c"

      - name: Execute qualification-first canonical batch
        shell: bash
        run: |
          set -euo pipefail
          build/m3-a2/venv/bin/python scripts/measurement/m3_batch.py \
            --registry .work/m3-a2/case-registry-v1.json \
            --plan .work/m3-a2/matrix-plan-v2.json \
            --source-file build/m3-a2/source/_video.py \
            --git-commit "$GITHUB_SHA" \
            --runner-image "${ImageOS:-ubuntu-24.04}@${ImageVersion:-unknown}" \
            --media-probe-mode range-set \
            --output-dir build/m3-a2/evidence

      - name: Revalidate complete aggregate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/measurement/m3_contracts.py validate \
            --input build/m3-a2/evidence/qualification/v1-qualified.json
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          registry = json.loads(
              pathlib.Path(".work/m3-a2/case-registry-v1.json").read_text(encoding="utf-8")
          )
          v1 = next(case for case in registry["cases"] if case["caseClass"] == "V1")
          target = pathlib.Path(v1["qualification"]["evidencePath"])
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(
              "build/m3-a2/evidence/qualification/v1-qualified.json",
              target,
          )
          PY
          python3 scripts/measurement/m3_matrix.py aggregate \
            --registry .work/m3-a2/case-registry-v1.json \
            --input-dir build/m3-a2/evidence/probes \
            --output build/m3-a2/recheck/matrix-v1.json \
            --markdown build/m3-a2/recheck/matrix-v1.md \
            --require-complete
          cmp \
            build/m3-a2/evidence/aggregate/matrix-v1.json \
            build/m3-a2/recheck/matrix-v1.json

      - name: Remove ephemeral pinned source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/m3-a2/source

      - name: Upload redacted canonical evidence bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3-a2-canonical-matrix
          path: build/m3-a2/evidence/
          if-no-files-found: warn
          retention-days: 30
