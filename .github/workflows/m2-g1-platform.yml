name: M2-G1 Platform Transport Correctness

on:
  pull_request:
    paths:
      - ".github/workflows/m2-f-platform.yml"
      - "core/engine/**"
      - "tools/media-lab/**"
      - "scripts/faults/m2_e0_netns.sh"
      - "scripts/ci/prepare-emulator.sh"
      - "scripts/ci/verify-m2-g1-platform.py"
      - "test-fixtures/media/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/m2-f-platform.yml"
      - "core/engine/**"
      - "tools/media-lab/**"
      - "scripts/faults/m2_e0_netns.sh"
      - "scripts/ci/verify-m2-g1-platform.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-g1-platform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api36-route-vpn:
    name: m2-g1-api36-route-vpn
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Build G1 probe and Media Lab
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --dependency-verification=strict --configuration-cache \
            :core:engine:assembleDebugAndroidTest \
            :tools:media-lab:installDist

      - name: Prepare API 36 emulator
        shell: bash
        run: |
          bash scripts/ci/prepare-emulator.sh \
            36 \
            m2-g1-api36 \
            build/m2-g1/device

      - name: Prove both G1 backends on the same exact permitted API36 route
        shell: bash
        run: |
          set -euo pipefail

          root="$PWD/build/m2-g1"
          server_root="$root/server"
          evidence_root="$root/evidence"
          mkdir -p "$server_root" "$evidence_root"

          LAB_BIN="$(find tools/media-lab/build/install -type f -name media-lab -perm -111 | head -1)"
          test -n "$LAB_BIN"
          LAB_BIN="$(realpath "$LAB_BIN")"
          trace="$server_root/requests.jsonl"
          lab_pid=""

          cleanup() {
            set +e
            adb shell cmd connectivity airplane-mode disable >/dev/null 2>&1
            adb shell svc data enable >/dev/null 2>&1
            adb shell svc wifi enable >/dev/null 2>&1
            if [[ -n "$lab_pid" ]] && kill -0 "$lab_pid" 2>/dev/null; then
              kill "$lab_pid" >/dev/null 2>&1 || true
              wait "$lab_pid" >/dev/null 2>&1 || true
            fi
            bash scripts/faults/m2_e0_netns.sh teardown >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          bash scripts/faults/m2_e0_netns.sh prepare
          ns="$(bash scripts/faults/m2_e0_netns.sh namespace)"
          media_addr="$(bash scripts/faults/m2_e0_netns.sh media-address)"

          sudo -n ip netns exec "$ns" \
            env JAVA_HOME="$JAVA_HOME" PATH="$JAVA_HOME/bin:/usr/bin:/bin" \
            "$LAB_BIN" serve \
              "--fixture-root=$PWD/test-fixtures/media" \
              "--trace=$trace" \
              --session-id=m2-g1-platform \
              --profile=N0 \
              "--data-bind-address=$media_addr" \
              --data-port=18081 \
              --control-port=18082 \
            > "$server_root/media-lab.out" \
            2> "$server_root/media-lab.err" &
          lab_pid=$!

          for attempt in {1..60}; do
            if sudo -n ip netns exec "$ns" \
              curl --fail --silent http://127.0.0.1:18082/__lab/config \
              > "$server_root/config.json"; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              cat "$server_root/media-lab.err" >&2 || true
              exit 1
            fi
            sleep 0.1
          done

          adb get-state | tee "$root/adb-before.txt" | grep -Fxq device
          if adb reverse --list | grep -Eq 'tcp:18081([[:space:]]|$)'; then
            echo "M2-G1 media path must not use adb reverse" >&2
            exit 1
          fi
          printf 'ok\n' > "$root/media-reverse-absent.txt"

          ./gradlew --dependency-verification=strict \
            :core:engine:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.definitelystable.spongetube.core.engine.route.PlatformHttpTransportAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.spongetube.m2g1.originBaseUrl="http://$media_addr:18081"

          adb get-state | tee "$root/adb-after.txt" | grep -Fxq device
          sudo -n ip netns exec "$ns" \
            curl --fail --silent http://127.0.0.1:18082/__lab/config \
            > "$root/control-after.json"

          source_dir="$(find core/engine/build/outputs/connected_android_test_additional_output \
            -type d -path '*/m2-g1-platform' -print -quit)"
          test -n "$source_dir"
          cp -R "$source_dir/." "$evidence_root/"

          test -s "$trace"
          python3 scripts/ci/verify-m2-g1-platform.py \
            "$evidence_root" \
            "$trace"

          cleanup
          trap - EXIT
          bash scripts/faults/m2_e0_netns.sh assert-clean
          adb get-state | tee "$root/adb-clean.txt" | grep -Fxq device
          printf 'ok\n' > "$root/cleanup.txt"

      - name: Cleanup G1 lab
        if: always()
        shell: bash
        run: |
          set +e
          adb shell cmd connectivity airplane-mode disable >/dev/null 2>&1
          adb shell svc data enable >/dev/null 2>&1
          adb shell svc wifi enable >/dev/null 2>&1
          bash scripts/faults/m2_e0_netns.sh teardown >/dev/null 2>&1 || true
          adb emu kill >/dev/null 2>&1 || true

      - name: Upload G1 feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-g1-platform-feasibility
          path: |
            build/m2-g1/
            core/engine/build/outputs/androidTest-results/
            core/engine/build/outputs/connected_android_test_additional_output/
            core/engine/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 14
