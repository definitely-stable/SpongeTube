name: M3-A2-C2-D3 Paired Reference Version Comparator

# Canonical D3 run 40214965133 completed; research manual dispatch only.
# No automatic provider I/O on PR or main changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-c2-d3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout pinned experiment producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate exact frozen D3 controls offline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/measurement/m3_c2_d3.py validate-plan

      - name: Fetch frozen reference test-case identities ephemerally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m3-c2-d3/source
          python3 - <<'PY'
          import json, pathlib, urllib.request
          cases = json.loads(pathlib.Path(".work/m3-a2/case-registry-v1.json").read_text())["cases"]
          sources = [c["selectionEvidence"] for c in cases]
          repositories = {c["sourceRepository"] for c in sources}
          revisions = {c["sourceRevision"] for c in sources}
          paths = {c["sourcePath"] for c in sources}
          if repositories != {"yt-dlp/yt-dlp"} or len(revisions) != 1 or len(paths) != 1:
              raise SystemExit("Frozen reference test-case source drift")
          url = "https://raw.githubusercontent.com/yt-dlp/yt-dlp/" + next(iter(revisions)) + "/" + next(iter(paths))
          with urllib.request.urlopen(url, timeout=30) as response:
              content = response.read(2 * 1024 * 1024 + 1)
          if not content or len(content) > 2 * 1024 * 1024:
              raise SystemExit("Reference fixture size bound violated")
          pathlib.Path("build/m3-c2-d3/source/_video.py").write_bytes(content)
          print("Ephemeral reference case source fetched")
          PY

      - name: Prepare isolated pinned reference environments
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv build/m3-c2-d3/venv-a
          python3 -m venv build/m3-c2-d3/venv-b
          build/m3-c2-d3/venv-a/bin/python -m pip install --disable-pip-version-check --no-input "yt-dlp==2026.8.19"
          build/m3-c2-d3/venv-b/bin/python -m pip install --disable-pip-version-check --no-input "yt-dlp==2026.10.21"
          test "$(build/m3-c2-d3/venv-a/bin/python -c 'import yt_dlp.version; print(yt_dlp.version.__version__)')" = "2026.08.19"
          test "$(build/m3-c2-d3/venv-a/bin/python -c 'import yt_dlp.version; print(yt_dlp.version.RELEASE_GIT_HEAD)')" = "594bd50c2c78ac432f81600d309fdc4e0a92d82c"
          test "$(build/m3-c2-d3/venv-b/bin/python -c 'import yt_dlp.version; print(yt_dlp.version.__version__)')" = "2026.10.21"
          test "$(build/m3-c2-d3/venv-b/bin/python -c 'import yt_dlp.version; print(yt_dlp.version.RELEASE_GIT_HEAD)')" = "8cdf4fea48ecf4064387375301d7f294ebdb17c1"

      - name: Observe fixed version-paired controls with 0 media reads
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/measurement/m3_c2_d3.py run \
            --source-file build/m3-c2-d3/source/_video.py \
            --python-a build/m3-c2-d3/venv-a/bin/python \
            --python-b build/m3-c2-d3/venv-b/bin/python \
            --git-commit "$GITHUB_SHA" \
            --runner-image "${ImageOS:-ubuntu-24.04}@${ImageVersion:-unknown}" \
            --output-dir build/m3-c2-d3/evidence

      - name: Independently validate output against frozen paired contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/measurement/m3_c2_d3.py verify \
            --source-file build/m3-c2-d3/source/_video.py \
            --git-commit "$GITHUB_SHA" \
            --runner-image "${ImageOS:-ubuntu-24.04}@${ImageVersion:-unknown}" \
            --output-dir build/m3-c2-d3/evidence

      - name: Remove ephemeral provider identities
        if: always()
        shell: bash
        run: rm -rf build/m3-c2-d3/source

      - name: Upload only validated typed reference diagnostics
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3-a2-c2-d3-version-pairs
          path: build/m3-c2-d3/evidence/
          if-no-files-found: error
          retention-days: 30
