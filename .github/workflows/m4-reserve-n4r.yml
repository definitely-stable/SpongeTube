name: M4-A1b N4R Body Restore

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m4-reserve-n4r.yml"
      - "core/engine/**"
      - "core/storage/**"
      - "test-support/fixture-f1/**"
      - "test-support/playback-f1/**"
      - "test-fixtures/media/**"
      - "tools/media-lab/**"
      - "scripts/ci/prepare-emulator.sh"
      - "scripts/ci/verify-m4-a1b-n4r-evidence.sh"
      - "scripts/measurement/m4_n4r_reserve_verifier.py"
      - "scripts/measurement/tests/test_m4_n4r_reserve_verifier.py"
      - "scripts/measurement/m4_reserve_verifier.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/m4-reserve-n4r.yml"
      - "core/engine/**"
      - "core/storage/**"
      - "test-support/fixture-f1/**"
      - "test-support/playback-f1/**"
      - "test-fixtures/media/**"
      - "tools/media-lab/**"
      - "scripts/ci/prepare-emulator.sh"
      - "scripts/ci/verify-m4-a1b-n4r-evidence.sh"
      - "scripts/measurement/m4_n4r_reserve_verifier.py"
      - "scripts/measurement/tests/test_m4_n4r_reserve_verifier.py"
      - "scripts/measurement/m4_reserve_verifier.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-n4r-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  n4r-body-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact source revision
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p build/m4-a1b-n4r
          printf '%s\n' "$SOURCE_SHA" > build/m4-a1b-n4r/source-sha.txt

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Falsify N4R oracle and build test target
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s scripts/measurement/tests \
            -p 'test_m4_n4r_reserve_verifier.py' -v
          ./gradlew --dependency-verification=strict --configuration-cache \
            :core:engine:assembleDebugAndroidTest \
            :tools:media-lab:installDist

      - name: Prepare API 36 emulator
        shell: bash
        run: |
          bash scripts/ci/prepare-emulator.sh \
            36 m4-a1b-n4r-api36 build/m4-a1b-n4r/device

      - name: Run N4R blocked HTTP, restore and independent evidence audit
        shell: bash
        run: |
          set -euo pipefail
          root="build/m4-a1b-n4r"
          mkdir -p "$root/server"
          trace="$PWD/$root/server/requests.jsonl"
          gate_trace="$PWD/$root/server/requests.gate.jsonl"
          LAB_BIN="$(find tools/media-lab/build/install -type f -name media-lab -perm -111 | head -1)"
          test -n "$LAB_BIN"
          "$LAB_BIN" serve \
            "--fixture-root=$PWD/test-fixtures/media" \
            "--trace=$trace" \
            --session-id=m4-a1b-n4r \
            --profile=N4R \
            --data-port=18081 \
            --control-port=18082 \
            > "$root/server/media-lab.out" \
            2> "$root/server/media-lab.err" &
          lab_pid=$!
          cleanup() {
            kill "$lab_pid" 2>/dev/null || true
            adb reverse --remove tcp:18082 >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18082/__lab/config \
              > "$root/server/scenario.json"; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$root/server/media-lab.err"
              exit 1
            fi
            sleep 1
          done
          jq -e '.profileId == "N4R" and .sessionId == "m4-a1b-n4r"' \
            "$root/server/scenario.json"
          adb reverse tcp:18080 tcp:18081
          adb reverse tcp:18082 tcp:18082

          ./gradlew --dependency-verification=strict \
            :core:engine:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.definitelystable.spongetube.core.engine.M4ReserveN4RAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.spongetube.m4n4r.originBaseUrl=http://127.0.0.1:18080 \
            -Pandroid.testInstrumentationRunnerArguments.spongetube.m4n4r.controlBaseUrl=http://127.0.0.1:18082

          # Timed-out HTTP server handlers finish only once the body gate opens.
          # Wait for all trace rows rather than accepting truncated evidence.
          for attempt in {1..100}; do
            count="$(python3 -c 'import json,sys; print(sum(1 for l in open(sys.argv[1]) if l.strip() and json.loads(l).get("plane") == "data"))' "$trace" 2>/dev/null || echo 0)"
            [[ "$count" -ge 6 ]] && break
            sleep 0.2
          done
          bash scripts/ci/verify-m4-a1b-n4r-evidence.sh \
            "$root/acceptance" "$trace" "$gate_trace"

          cleanup
          trap - EXIT

      - name: Upload retained N4R Android evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m4-a1b-n4r-physical-restore-evidence
          path: |
            build/m4-a1b-n4r/
            core/engine/build/outputs/androidTest-results/
            core/engine/build/outputs/connected_android_test_additional_output/
            core/engine/build/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill || true
