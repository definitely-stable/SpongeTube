name: B3 Generate Canonical Fixtures

on:
  push:
    branches:
      - test/5-canonical-media-fixtures
    paths:
      - ".github/workflows/b3-generate-fixtures.yml"
      - "scripts/media-lab/generate-fixtures.sh"
      - "scripts/media-lab/build_fixture_metadata.py"

permissions:
  contents: write

concurrency:
  group: b3-generate-canonical-fixtures
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout fixture branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Install FFmpeg build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            gnupg \
            libx264-dev \
            nasm \
            pkg-config \
            xz-utils \
            yasm

      - name: Build verified FFmpeg 9.0.2
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          curl --fail --show-error --silent --location \
            --output ffmpeg-9.0.2.tar.xz \
            https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
          curl --fail --show-error --silent --location \
            --output ffmpeg-9.0.2.tar.xz.asc \
            https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz.asc
          curl --fail --show-error --silent --location \
            https://ffmpeg.org/ffmpeg-devel.asc | gpg --batch --import

          echo "8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e  ffmpeg-9.0.2.tar.xz" \
            | sha256sum --check --strict
          gpg --batch --verify ffmpeg-9.0.2.tar.xz.asc ffmpeg-9.0.2.tar.xz

          tar -xf ffmpeg-9.0.2.tar.xz
          cd ffmpeg-9.0.2

          ./configure \
            --prefix="$RUNNER_TEMP/ffmpeg-install" \
            --enable-gpl \
            --enable-libx264 \
            --disable-debug \
            --disable-doc \
            --disable-ffplay

          make -j"$(nproc)"
          make install

          echo "$RUNNER_TEMP/ffmpeg-install/bin" >> "$GITHUB_PATH"

      - name: Generate canonical fixtures
        shell: bash
        run: |
          chmod +x scripts/media-lab/generate-fixtures.sh
          scripts/media-lab/generate-fixtures.sh

      - name: Verify generated corpus
        shell: bash
        run: |
          ./gradlew --configuration-cache :tools:media-lab:test

      - name: Commit generated corpus to B3 branch
        shell: bash
        run: |
          if git diff --quiet -- test-fixtures/media && \
             [[ -z "$(git status --porcelain --untracked-files=all test-fixtures/media)" ]]; then
            echo "Canonical corpus is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-fixtures/media
          git commit -m "test(fixtures): add canonical FFmpeg 9.0.2 corpus"
          git push origin HEAD:test/5-canonical-media-fixtures
