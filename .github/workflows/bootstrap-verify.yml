name: Bootstrap Verify

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".work/**"
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
      - ".work/**"

permissions:
  contents: read

concurrency:
  group: bootstrap-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-verify:
    # Pin the runner while M0 evidence is being established. ubuntu-latest is
    # scheduled to migrate to Ubuntu 26.04 in late 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          # PRs consume the trusted default-branch cache. Only a push to main
          # is allowed to refresh it, avoiding PR-scoped cache churn/poisoning.
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Verify Android API 36 baseline
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          PLATFORM_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          AAPT2="$SDK_ROOT/build-tools/36.0.0/aapt2"

          if [[ -f "$PLATFORM_JAR" && -x "$AAPT2" ]]; then
            echo "Android API 36 and Build Tools 36.0.0 are already present on the runner image."
            exit 0
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Required Android SDK packages are missing; installing fallback packages."
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Require committed dependency verification metadata
        shell: bash
        run: |
          test -s gradle/verification-metadata.xml

      - name: Verify build and configuration cache
        shell: bash
        run: |
          ./gradlew --configuration-cache check assembleDebug :benchmark:assembleBenchmark
          ./gradlew --configuration-cache check assembleDebug :benchmark:assembleBenchmark

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-verify
          path: |
            gradle/verification-metadata.xml
            app/build/reports/
            benchmark/build/reports/
            benchmark/build/outputs/
            tools/media-lab/build/reports/
            tools/media-lab/build/test-results/
          if-no-files-found: warn
