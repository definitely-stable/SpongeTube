name: Bootstrap Verify

on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/bootstrap-verify.yml"

permissions:
  contents: read

concurrency:
  group: bootstrap-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate dependency verification metadata
        shell: bash
        run: |
          ./gradlew --write-verification-metadata sha256 help assembleDebug
          echo "::group::verification-metadata.xml"
          cat gradle/verification-metadata.xml
          echo "::endgroup::"

      - name: Verify build and configuration cache
        shell: bash
        run: |
          ./gradlew --configuration-cache check assembleDebug
          ./gradlew --configuration-cache check assembleDebug

      - name: Upload bootstrap artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-verify
          path: |
            gradle/verification-metadata.xml
            app/build/reports/
          if-no-files-found: warn
