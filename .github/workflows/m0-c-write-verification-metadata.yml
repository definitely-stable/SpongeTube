name: M0-C Write Verification Metadata

on:
  pull_request:
    branches: [ main ]
    paths:
      - "gradle/libs.versions.toml"
      - "gradle/verification-metadata.xml"
      - "playback/baseline/**"
      - "app/build.gradle.kts"
      - ".github/workflows/m0-c-write-verification-metadata.yml"

permissions:
  contents: write

concurrency:
  group: m0-c-verification-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  write-metadata:
    if: github.head_ref == 'test/6-media3-baseline-playback'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout M0-C branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: test/6-media3-baseline-playback
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve dependencies and write SHA-256 metadata
        shell: bash
        run: |
          set +e
          ./gradlew --write-verification-metadata sha256 check assembleDebug
          status=$?
          set -e

          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "No dependency verification metadata changes were produced."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradle/verification-metadata.xml
            git commit -m "build(media3): update dependency verification metadata"
            git push origin HEAD:test/6-media3-baseline-playback
          fi

          echo "Initial Gradle status=$status; normal Bootstrap Verify owns compile/test verdict."
