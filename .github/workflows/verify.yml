name: Verify

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Verify Android API 36 baseline
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          PLATFORM_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          AAPT2="$SDK_ROOT/build-tools/36.0.0/aapt2"

          if [[ -f "$PLATFORM_JAR" && -x "$AAPT2" ]]; then
            exit 0
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify dependency and measurement contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/verification-metadata.xml
          test -n "$(grep '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2)"
          python3 -m unittest discover -s scripts/measurement/tests -p 'test_*.py' -v

      - name: Verify build and configuration cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verify
          TASKS=(
            check
            assembleDebug
            :core:engine:check
            :core:engine:assembleDebug
            :benchmark:assembleBenchmark
          )
          ./gradlew --dependency-verification=strict --configuration-cache "${TASKS[@]}"             | tee build/verify/gradle-first.log
          ./gradlew --dependency-verification=strict --configuration-cache "${TASKS[@]}"             | tee build/verify/gradle-second.log
          grep -Eq 'Reusing configuration cache|Configuration cache entry reused'             build/verify/gradle-second.log

      - name: Verify committed Room schemas after build
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- core/storage/schemas/
          test -z "$(git status --porcelain --untracked-files=all -- core/storage/schemas/)"

      - name: Verify M1 ACC-15 range continuation evidence
        shell: bash
        run: |
          bash scripts/ci/verify-m1-acc15-evidence.sh \
            build/m1-acc15

      - name: Upload M1 ACC-15 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-acc15-evidence
          path: build/m1-acc15/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify M1 ACC-07 cancellation ownership evidence
        shell: bash
        run: |
          bash scripts/ci/verify-m1-acc07-evidence.sh \
            build/m1-acc07

      - name: Upload M1 ACC-07 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-acc07-evidence
          path: build/m1-acc07/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-failure
          path: |
            gradle/verification-metadata.xml
            app/build/reports/
            benchmark/build/reports/
            benchmark/build/outputs/
            tools/media-lab/build/reports/
            tools/media-lab/build/test-results/
            core/storage/build/reports/
            core/storage/build/test-results/
            core/storage/schemas/
            core/engine/build/reports/
            core/engine/build/test-results/
            build/verify/
          if-no-files-found: warn
          retention-days: 7



  windows-verify:
    name: windows verify
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Verify Windows build and byte-exact fixtures
        shell: pwsh
        run: |
          ./gradlew.bat --dependency-verification=strict --configuration-cache check assembleDebug
