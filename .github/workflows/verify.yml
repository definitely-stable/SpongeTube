name: Verify

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      - name: Verify Android API 36 baseline
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          PLATFORM_JAR="$SDK_ROOT/platforms/android-36/android.jar"
          AAPT2="$SDK_ROOT/build-tools/36.0.0/aapt2"

          if [[ -f "$PLATFORM_JAR" && -x "$AAPT2" ]]; then
            exit 0
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify dependency and measurement contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s gradle/verification-metadata.xml
          test -n "$(grep '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties | cut -d= -f2)"
          python3 -m unittest discover -s scripts/measurement/tests -p 'test_*.py' -v

      - name: Verify build and configuration cache
        shell: bash
        run: |
          set -euo pipefail
          TASKS=(check assembleDebug :benchmark:assembleBenchmark)
          ./gradlew --dependency-verification=strict --configuration-cache "${TASKS[@]}"
          ./gradlew --dependency-verification=strict --configuration-cache "${TASKS[@]}"

      - name: Verify committed Room schemas
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- core/storage/schemas/
          test -z "$(git status --porcelain --untracked-files=all -- core/storage/schemas/)"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-failure
          path: |
            gradle/verification-metadata.xml
            app/build/reports/
            benchmark/build/reports/
            benchmark/build/outputs/
            tools/media-lab/build/reports/
            tools/media-lab/build/test-results/
            core/storage/build/reports/
            core/storage/build/test-results/
            core/storage/schemas/
            core/engine/build/reports/
            core/engine/build/test-results/
          if-no-files-found: warn
          retention-days: 7
