name: M2-F Route Recovery

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source revision to checkout for canonical callers.
        required: false
        type: string
        default: ""
      concurrency_suffix:
        description: Unique suffix for nested canonical callers.
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - ".github/workflows/m2-f-route-recovery.yml"
      - "core/engine/**"
      - "core/storage/**"
      - "tools/media-lab/**"
      - "scripts/faults/m2_e0_netns.sh"
      - "scripts/ci/prepare-emulator.sh"
      - "scripts/ci/verify-m2-f2-route-recovery.py"
      - "scripts/measurement/m2_f_route_oracle.py"
      - "scripts/measurement/m2_contracts.py"
      - ".work/schemas/m2-f-*.schema.json"
      - ".work/schemas/m2-*.schema.json"
      - "test-fixtures/media/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/m2-f-route-recovery.yml"
      - "core/engine/**"
      - "core/storage/**"
      - "tools/media-lab/**"
      - "scripts/faults/m2_e0_netns.sh"
      - "scripts/ci/verify-m2-f2-route-recovery.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-f2-route-recovery-${{ inputs.concurrency_suffix || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api36-route-recovery:
    name: m2-f2-api36-route-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind exact source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p build/m2-f2
          printf '%s\n' "$SOURCE_SHA" > build/m2-f2/source-sha.txt

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Build F2 integration target and Media Lab
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --dependency-verification=strict --configuration-cache \
            :core:engine:assembleDebugAndroidTest \
            :tools:media-lab:installDist

      - name: Prepare API 36 emulator
        shell: bash
        run: |
          bash scripts/ci/prepare-emulator.sh \
            36 \
            m2-f2-api36 \
            build/m2-f2/device

      - name: Prove one-chain recovery across actual default-route replacement
        shell: bash
        run: |
          set -euo pipefail

          root="$PWD/build/m2-f2"
          server_root="$root/server"
          evidence_root="$root/evidence"
          mkdir -p "$server_root" "$evidence_root"

          LAB_BIN="$(find tools/media-lab/build/install -type f -name media-lab -perm -111 | head -1)"
          test -n "$LAB_BIN"
          LAB_BIN="$(realpath "$LAB_BIN")"
          trace="$server_root/requests.jsonl"
          lab_pid=""

          cleanup() {
            set +e
            adb shell cmd connectivity airplane-mode disable >/dev/null 2>&1
            adb shell svc data enable >/dev/null 2>&1
            adb shell svc wifi enable >/dev/null 2>&1
            if [[ -n "$lab_pid" ]] && kill -0 "$lab_pid" 2>/dev/null; then
              kill "$lab_pid" >/dev/null 2>&1 || true
              wait "$lab_pid" >/dev/null 2>&1 || true
            fi
            bash scripts/faults/m2_e0_netns.sh teardown >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          bash scripts/faults/m2_e0_netns.sh prepare
          ns="$(bash scripts/faults/m2_e0_netns.sh namespace)"
          media_addr="$(bash scripts/faults/m2_e0_netns.sh media-address)"

          sudo -n ip netns exec "$ns" \
            env JAVA_HOME="$JAVA_HOME" PATH="$JAVA_HOME/bin:/usr/bin:/bin" \
            "$LAB_BIN" serve \
              "--fixture-root=$PWD/test-fixtures/media" \
              "--trace=$trace" \
              --session-id=m2-f2-route-recovery \
              --profile=N0 \
              "--data-bind-address=$media_addr" \
              --data-port=18081 \
              --control-port=18082 \
            > "$server_root/media-lab.out" \
            2> "$server_root/media-lab.err" &
          lab_pid=$!

          for attempt in {1..60}; do
            if sudo -n ip netns exec "$ns" \
              curl --fail --silent http://127.0.0.1:18082/__lab/config \
              > "$server_root/config.json"; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              cat "$server_root/media-lab.err" >&2 || true
              exit 1
            fi
            sleep 0.1
          done

          adb get-state | tee "$root/adb-before.txt" | grep -Fxq device
          if adb reverse --list | grep -Eq 'tcp:18081([[:space:]]|$)'; then
            echo "M2-F2 media path must not use adb reverse" >&2
            exit 1
          fi
          printf 'ok\n' > "$root/media-reverse-absent.txt"

          ./gradlew --dependency-verification=strict \
            :core:engine:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.definitelystable.spongetube.core.engine.route.RouteRecoveryAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.spongetube.m2f2.originBaseUrl="http://$media_addr:18081"

          adb get-state | tee "$root/adb-after.txt" | grep -Fxq device
          sudo -n ip netns exec "$ns" \
            curl --fail --silent http://127.0.0.1:18082/__lab/config \
            > "$root/control-after.json"

          source_dir="$(find core/engine/build/outputs/connected_android_test_additional_output \
            -type d -path '*/m2-f2-route-recovery' -print -quit)"
          test -n "$source_dir"
          cp -R "$source_dir/." "$evidence_root/"

          test -s "$trace"
          python3 scripts/ci/verify-m2-f2-route-recovery.py \
            "$evidence_root" \
            "$trace"

          checkout_sha="$(git rev-parse HEAD)"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/measurement/m2_f_route_oracle.py prepare \
            --evidence-dir "$evidence_root" \
            --case-kind F2_DEFAULT_ROUTE_LOSS_RESTORE \
            --git-commit "$checkout_sha" \
            --created-at-utc "$created_at"
          python3 scripts/measurement/m2_f_route_oracle.py verify \
            --evidence-dir "$evidence_root" \
            --case-kind F2_DEFAULT_ROUTE_LOSS_RESTORE \
            --origin "$trace" \
            --expected-git-commit "$checkout_sha"

          cleanup
          trap - EXIT
          bash scripts/faults/m2_e0_netns.sh assert-clean
          adb get-state | tee "$root/adb-clean.txt" | grep -Fxq device
          printf 'ok\n' > "$root/cleanup.txt"

      - name: Cleanup F2 lab
        if: always()
        shell: bash
        run: |
          set +e
          adb shell cmd connectivity airplane-mode disable >/dev/null 2>&1
          adb shell svc data enable >/dev/null 2>&1
          adb shell svc wifi enable >/dev/null 2>&1
          bash scripts/faults/m2_e0_netns.sh teardown >/dev/null 2>&1 || true
          adb emu kill >/dev/null 2>&1 || true

      - name: Upload F2 route recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-f2-route-recovery
          path: |
            build/m2-f2/
            core/engine/build/outputs/androidTest-results/
            core/engine/build/outputs/connected_android_test_additional_output/
            core/engine/build/reports/androidTests/
          if-no-files-found: error
          retention-days: 14
