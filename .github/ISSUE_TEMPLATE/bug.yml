name: Bug report
description: Report a reproducible SpongeTube defect
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        Report observable behavior. Do not guess the network/provider cause when it is not known.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps, including network/offline/VPN conditions when relevant.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device, Android version, app build/commit, network type, VPN state if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, diagnostics, screenshots or benchmark profile. Remove secrets/private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue describing the same problem.
          required: true
        - label: I removed secrets, tokens and private information from attachments/logs.
          required: true
