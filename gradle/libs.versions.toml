[versions]
agp = "9.4.0"
kotlin = "2.2.10"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
junit = "6.1.3"
media3 = "1.11.1"
benchmark = "1.5.0"
tracing = "2.0.2"
test-runner = "1.7.0"
test-ext-junit = "1.3.0"
uiautomator = "2.4.0"
profileinstaller = "1.4.1"
room3 = "3.0.3"
sqlite = "2.7.1"
ksp = "2.3.12"
coroutines = "1.11.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
